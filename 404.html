<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>页面不存在 · WhiteShell</title>

<link rel="icon" href="assets/img/favicon-32.png?v=mwnzkvv9" sizes="32x32" type="image/png">
<link rel="icon" href="assets/img/favicon.ico?v=mwnzkvv9">
<link rel="stylesheet" href="assets/css/app.css?v=mwnzkvv9">
<link rel="stylesheet" href="assets/css/fonts.css?v=mwnzkvv9">

<script>
(function () {
  var root = document.documentElement;
  try {
    var saved = localStorage.getItem('ws-t');
    if (!saved) saved = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    root.setAttribute('data-theme', saved);
  } catch (e) {
    root.setAttribute('data-theme', 'dark');
  }
})();
</script>
<meta name="ws-build" content="mwnzkvv9">
</head>
<body>

<div class="bg" aria-hidden="true">
  <span class="orb a"></span>
  <span class="orb b"></span>
</div>

<main class="error-page">
  <div>
    <div class="code">404</div>
    <p>页面不存在，或已经移动到别的位置。</p>
    <a class="btn-pill btn-blue" href="./">返回首页</a>
  </div>
</main>

</body>
</html>
